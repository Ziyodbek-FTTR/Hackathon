<!DOCTYPE html>
<html lang="uz">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnonBack — Anonymous Feedback. Better Healthcare.</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f7faff;
            color: #102a43;
            min-height: 100vh;
        }

        .navbar {
            height: 78px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 70px;
            background: #ffffff;
            border-bottom: 1px solid #e8eef5;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 22px;
            font-weight: 700;
            color: #123c78;
            letter-spacing: -0.5px;
        }

        .logo-mark {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: #1261d6;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 19px;
            font-weight: 700;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 28px;
        }

        .nav-link {
            color: #52677d;
            font-size: 15px;
            text-decoration: none;
        }

        .lang-switch {
            display: flex;
            border: 1px solid #d6e1ed;
            border-radius: 9px;
            overflow: hidden;
            background: #ffffff;
        }

        .lang-btn {
            border: none;
            background: transparent;
            color: #52677d;
            font-family: inherit;
            font-size: 13px;
            font-weight: 600;
            padding: 8px 13px;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .lang-btn+.lang-btn {
            border-left: 1px solid #d6e1ed;
        }

        .lang-btn:hover {
            background: #f2f7fd;
        }

        .lang-btn.active,
        .lang-btn.active:hover {
            background: #1261d6;
            color: #ffffff;
        }

        .hero {
            min-height: calc(100vh - 78px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 70px;
        }

        .hero-content {
            max-width: 850px;
            text-align: center;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            padding: 8px 15px;
            border-radius: 30px;
            background: #eaf3ff;
            color: #1261d6;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 25px;
        }

        .hero h1 {
            font-size: 64px;
            line-height: 1.08;
            letter-spacing: -2.5px;
            color: #102f5b;
            margin-bottom: 24px;
        }

        .hero h1 .accent {
            color: #1261d6;
        }

        .hero p {
            max-width: 650px;
            margin: 0 auto;
            font-size: 19px;
            line-height: 1.7;
            color: #61758a;
        }

        .hero-actions {
            margin-top: 38px;
            display: flex;
            justify-content: center;
            gap: 14px;
        }

        .primary-btn,
        .submit-btn {
            border: none;
            background: #1261d6;
            color: white;
            padding: 15px 28px;
            border-radius: 9px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .primary-btn:hover,
        .submit-btn:hover {
            background: #0d4fae;
            transform: translateY(-1px);
        }

        .secondary-btn {
            border: 1px solid #d6e1ed;
            background: white;
            color: #294763;
            padding: 15px 28px;
            border-radius: 9px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .trust-line {
            margin-top: 45px;
            font-size: 13px;
            color: #8192a4;
        }

        .feedback-page {
            display: none;
            min-height: calc(100vh - 78px);
            padding: 50px 70px 80px;
        }

        .feedback-container {
            max-width: 760px;
            margin: 0 auto;
        }

        .back-btn {
            border: none;
            background: transparent;
            color: #52677d;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            padding: 8px 0;
            margin-bottom: 30px;
        }

        .feedback-header {
            margin-bottom: 30px;
        }

        .feedback-header h2 {
            font-size: 42px;
            color: #102f5b;
            letter-spacing: -1px;
            margin-bottom: 12px;
        }

        .feedback-header p {
            color: #61758a;
            font-size: 17px;
        }

        .feedback-card {
            background: #ffffff;
            border: 1px solid #e3ebf3;
            border-radius: 16px;
            padding: 35px;
            box-shadow: 0 12px 35px rgba(35, 71, 110, 0.06);
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            margin-bottom: 9px;
            color: #294763;
            font-size: 14px;
            font-weight: 600;
        }

        .form-group select,
        .form-group textarea {
            width: 100%;
            border: 1px solid #d7e2ec;
            border-radius: 9px;
            background: #fbfdff;
            color: #263f58;
            font-family: inherit;
            font-size: 15px;
            padding: 14px 15px;
            outline: none;
        }

        .form-group select {
            height: 50px;
        }

        .form-group textarea {
            min-height: 150px;
            resize: vertical;
            line-height: 1.6;
        }

        .form-group select:disabled {
            background: #f1f5f9;
            color: #8192a4;
            cursor: not-allowed;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .form-row .form-group {
            margin-bottom: 24px;
        }

        .form-error {
            margin-bottom: 18px;
            padding: 12px 14px;
            border: 1px solid #fecdca;
            border-radius: 9px;
            background: #fef3f2;
            color: #b42318;
            font-size: 14px;
            line-height: 1.5;
        }

        .form-group select:focus,
        .form-group textarea:focus {
            border-color: #1261d6;
            box-shadow: 0 0 0 3px rgba(18, 97, 214, 0.08);
        }

        .rating {
            display: flex;
            gap: 10px;
        }

        .rating button {
            width: 48px;
            height: 48px;
            border: 1px solid #d7e2ec;
            border-radius: 9px;
            background: #ffffff;
            color: #49647e;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        .rating button:hover,
        .rating button.active {
            background: #1261d6;
            border-color: #1261d6;
            color: #ffffff;
        }

        .submit-btn {
            width: 100%;
        }

        @media (max-width: 800px) {
            .navbar {
                padding: 0 25px;
            }

            .nav-right {
                gap: 14px;
            }

            .nav-link {
                font-size: 13px;
            }

            .form-row {
                grid-template-columns: 1fr;
                gap: 0;
            }

            .hero {
                padding: 50px 25px;
            }

            .hero h1 {
                font-size: 45px;
            }

            .feedback-page {
                padding: 35px 25px 60px;
            }
        }

        .confirmation-card {
            text-align: center;
        }

        .confirmation-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 22px;
            border-radius: 50%;
            background: #eaf3ff;
            color: #1769d1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: 700;
        }

        .confirmation-icon svg {
            width: 30px;
            height: 30px;
        }


        #confirmationPage {
            width: 100%;
            min-height: 100vh;
            box-sizing: border-box;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 60px 24px;
        }

        #confirmationPage .confirmation-card {
            width: min(680px, 100%);
            box-sizing: border-box;
            margin: 0 auto;
        }


        #howItWorksPage {
            width: 100%;
            min-height: 100vh;
            box-sizing: border-box;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 60px 24px;
        }

        #howItWorksPage .how-card {
            width: min(760px, 100%);
            box-sizing: border-box;
            margin: 0 auto;
        }

        .how-intro {
            max-width: 620px;
            margin: 0 auto 32px;
        }

        .how-steps {
            display: grid;
            gap: 16px;
            text-align: left;
            margin-bottom: 32px;
        }

        .how-step {
            display: flex;
            gap: 16px;
            align-items: flex-start;
            padding: 18px;
            border: 1px solid #e6edf5;
            border-radius: 14px;
            background: #fbfdff;
        }

        .step-number {
            flex: 0 0 34px;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: #1769d1;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }

        .how-step h3 {
            margin: 2px 0 6px;
            font-size: 17px;
        }

        .how-step p {
            margin: 0;
            color: #607086;
            line-height: 1.6;
        }


        /* Clean confirmation layout */
        #confirmationPage .confirmation-card {
            padding: 56px 64px;
            text-align: center;
        }

        #confirmationPage .confirmation-icon {
            margin-bottom: 28px;
        }

        #confirmationPage .badge {
            display: inline-block;
            margin-bottom: 22px;
        }

        #confirmationPage h2 {
            margin: 0 0 20px;
            line-height: 1.25;
        }

        #confirmationPage p {
            max-width: 560px;
            margin: 0 auto 34px;
            line-height: 1.8;
            color: #607086;
        }

        #confirmationPage .primary-btn {
            margin-top: 4px;
        }

        /* Clean How It Works layout */
        #howItWorksPage .how-card {
            padding: 52px 56px;
            text-align: center;
        }

        #howItWorksPage .badge {
            display: inline-block;
            margin-bottom: 20px;
        }

        #howItWorksPage h2 {
            margin: 0 0 18px;
            line-height: 1.25;
        }

        #howItWorksPage .how-intro {
            display: block;
            width: 100%;
            max-width: 600px;
            margin: 0 auto 36px;
            line-height: 1.8;
            color: #607086;
        }

        #howItWorksPage .how-steps {
            width: 100%;
            margin: 0 auto 34px;
            display: grid;
            gap: 18px;
            text-align: left;
        }

        #howItWorksPage .how-step {
            min-height: 72px;
            box-sizing: border-box;
            padding: 20px 22px;
            display: flex;
            align-items: flex-start;
            gap: 18px;
        }

        #howItWorksPage .step-number {
            flex-shrink: 0;
            margin-top: 2px;
        }

        #howItWorksPage .how-step h3 {
            margin: 0 0 8px;
            line-height: 1.35;
        }

        #howItWorksPage .how-step p {
            margin: 0;
            line-height: 1.65;
            color: #607086;
        }

        #howItWorksPage .primary-btn {
            margin-top: 0;
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <div class="logo">
            <div class="logo-mark">A</div>
            <span>AnonBack</span>
        </div>

        <div class="nav-right">
            <div class="lang-switch" role="group" data-i18n-aria-label="nav.language" aria-label="Language">
                <button type="button" class="lang-btn" data-lang="uz" aria-pressed="false">UZ</button>
                <button type="button" class="lang-btn" data-lang="ru" aria-pressed="false">Рус</button>
                <button type="button" class="lang-btn" data-lang="en" aria-pressed="false">ENG</button>
            </div>

            <a href="#" class="nav-link" data-i18n="nav.providers">For Healthcare Providers</a>
        </div>
    </nav>

    <main>

        <section class="hero" id="home">
            <div class="hero-content">

                <div class="badge" data-i18n="hero.badge"></div>

                <h1>
                    <span data-i18n="hero.title1"></span><br>
                    <span class="accent" data-i18n="hero.title2"></span>
                </h1>

                <p data-i18n="hero.desc"></p>

                <div class="hero-actions">
                    <button class="primary-btn" onclick="showFeedback()" data-i18n="hero.cta"></button>

                    <button class="secondary-btn" onclick="learnMore()" data-i18n="hero.how"></button>
                </div>

                <div class="trust-line" data-i18n="hero.trust"></div>

            </div>
        </section>

        <section class="feedback-page" id="feedbackPage">

            <div class="feedback-container">

                <button class="back-btn" onclick="showHome()" data-i18n="common.back"></button>

                <div class="feedback-header">
                    <div class="badge" data-i18n="fb.badge"></div>

                    <h2 data-i18n="fb.title"></h2>

                    <p data-i18n="fb.subtitle"></p>
                </div>

                <div class="feedback-card" id="feedbackCard">

                    <div class="form-group">
                        <label for="hospital" data-i18n="fb.hospital"></label>

                        <select id="hospital">
                            <option value="" data-i18n="fb.hospitalPh"></option>
                            <option value="central-city" data-i18n="hospital.centralCity"></option>
                            <option value="regional-medical" data-i18n="hospital.regionalMedical"></option>
                            <option value="university" data-i18n="hospital.university"></option>
                        </select>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="region" data-i18n="fb.region"></label>
                            <select id="region"></select>
                        </div>

                        <div class="form-group">
                            <label for="district" data-i18n="fb.district"></label>
                            <select id="district" disabled></select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="feedbackText" data-i18n="fb.text"></label>

                        <textarea id="feedbackText" data-i18n-placeholder="fb.textPh"></textarea>
                    </div>

                    <div class="form-group">
                        <label for="category" data-i18n="fb.category"></label>

                        <select id="category">
                            <option value="" data-i18n="fb.categoryPh"></option>
                            <option value="waiting-time" data-i18n="cat.waitingTime"></option>
                            <option value="staff-communication" data-i18n="cat.staffCommunication"></option>
                            <option value="registration" data-i18n="cat.registration"></option>
                            <option value="cleanliness" data-i18n="cat.cleanliness"></option>
                            <option value="doctor-experience" data-i18n="cat.doctorExperience"></option>
                            <option value="other" data-i18n="cat.other"></option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label data-i18n="fb.rating"></label>

                        <div class="rating">
                            <button type="button" onclick="setRating(1)" data-rating="1">1</button>
                            <button type="button" onclick="setRating(2)" data-rating="2">2</button>
                            <button type="button" onclick="setRating(3)" data-rating="3">3</button>
                            <button type="button" onclick="setRating(4)" data-rating="4">4</button>
                            <button type="button" onclick="setRating(5)" data-rating="5">5</button>
                        </div>
                    </div>

                    <div class="form-error" id="formError" role="alert" hidden></div>

                    <button class="submit-btn" onclick="submitFeedback()" data-i18n="fb.submit"></button>

                </div>
            </div>

        </section>

    </main>



    <section id="howItWorksPage" class="page" style="display: none;">
        <div class="feedback-card how-card">
            <span class="badge" data-i18n="how.badge"></span>
            <h2 data-i18n="how.title"></h2>
            <p class="how-intro" data-i18n="how.intro"></p>

            <div class="how-steps">
                <div class="how-step">
                    <div class="step-number">1</div>
                    <div>
                        <h3 data-i18n="how.s1t"></h3>
                        <p data-i18n="how.s1d"></p>
                    </div>
                </div>

                <div class="how-step">
                    <div class="step-number">2</div>
                    <div>
                        <h3 data-i18n="how.s2t"></h3>
                        <p data-i18n="how.s2d"></p>
                    </div>
                </div>

                <div class="how-step">
                    <div class="step-number">3</div>
                    <div>
                        <h3 data-i18n="how.s3t"></h3>
                        <p data-i18n="how.s3d"></p>
                    </div>
                </div>

                <div class="how-step">
                    <div class="step-number">4</div>
                    <div>
                        <h3 data-i18n="how.s4t"></h3>
                        <p data-i18n="how.s4d"></p>
                    </div>
                </div>
            </div>

            <button class="primary-btn" onclick="showHome()" data-i18n="common.backHome"></button>
        </div>
    </section>

    <section id="confirmationPage" class="page" style="display: none;">
        <div class="feedback-card confirmation-card">
            <div class="confirmation-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"
                    stroke-linejoin="round">
                    <polyline points="5 12.5 10 17.5 19 7"></polyline>
                </svg>
            </div>
            <span class="badge" data-i18n="conf.badge"></span>
            <h2 data-i18n="conf.title"></h2>
            <p data-i18n="conf.desc"></p>
            <button class="primary-btn" onclick="showHome()" data-i18n="common.backHome"></button>
        </div>
    </section>

        /* =====================================================
           LOCATIONS (centralized, stable IDs, localized names)
           Region -> districts (tumans) and cities of regional
           subordination. Selection is stored by ID, so switching
           language never invalidates it.
           ===================================================== */
        function slug(text) {
            return text.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
        }

        // District (tuman): uz name, ru adjective, en name
        function D(uz, ru, en) {
            return {
                id: slug(en) + "-district",
                name: {uz: uz + " tumani", ru: ru + " район", en: en + " District"},
                sort: {uz: uz, ru: ru, en: en}
            };
        }

        // City (shahar): uz name, ru name, en name
        function C(uz, ru, en) {
            return {
                id: slug(en) + "-city",
                name: {uz: uz + " shahri", ru: "город " + ru, en: en + " City"},
                sort: {uz: uz, ru: ru, en: en}
            };
        }

        function R(id, uz, ru, en, districts) {
            return {id: id, name: {uz: uz, ru: ru, en: en}, districts: districts};
        }

            if (text === undefined) text = key;
            if (params) {
                Object.keys(params).forEach(function (name) {
                    text = text.replace("{" + name + "}", params[name]);
                });
            }
            return text;
        }

        function readStoredLang() {
            try {
                const stored = localStorage.getItem(STORAGE_KEY);
                if (stored && translations[stored]) return stored;
            } catch (e) { /* storage unavailable */}
            return DEFAULT_LANG;
        }

        function storeLang(lang) {
            try {
                localStorage.setItem(STORAGE_KEY, lang);
            } catch (e) { /* storage unavailable */}
        }

        // Applies translations to every marked element inside root.
        // Can be called again for dynamically added markup.
        function applyTranslations(root) {
            root = root || document;
            root.querySelectorAll("[data-i18n]").forEach(function (el) {
                el.textContent = t(el.getAttribute("data-i18n"));
            });
            root.querySelectorAll("[data-i18n-placeholder]").forEach(function (el) {
                el.setAttribute("placeholder", t(el.getAttribute("data-i18n-placeholder")));
            });
            root.querySelectorAll("[data-i18n-title]").forEach(function (el) {
                el.setAttribute("title", t(el.getAttribute("data-i18n-title")));
            });
            root.querySelectorAll("[data-i18n-aria-label]").forEach(function (el) {
                el.setAttribute("aria-label", t(el.getAttribute("data-i18n-aria-label")));
            });
        }

        function setLanguage(lang) {
            if (!translations[lang]) lang = DEFAULT_LANG;
            currentLang = lang;
            storeLang(lang);

            document.documentElement.lang = lang;
            document.title = t("meta.title");

            applyTranslations();
            renderRegions();
            renderDistricts(true);
            renderRatingTitles();
            renderError();

            document.querySelectorAll(".lang-btn").forEach(function (btn) {
                const active = btn.getAttribute("data-lang") === lang;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-pressed", active ? "true" : "false");
            });
        }

        /* =====================================================
           REGION / DISTRICT
           ===================================================== */
        function findRegion(id) {
            return locations.regions.find(function (r) {return r.id === id;}) || null;
        }

        function appendOption(select, value, text) {
            const option = document.createElement("option");
            option.value = value;
            option.textContent = text;
            select.appendChild(option);
        }

        function renderRegions() {
            const select = document.getElementById("region");
            const previous = select.value;

            const pinned = locations.pinned.map(findRegion);
            const others = locations.regions
                .filter(function (r) {return locations.pinned.indexOf(r.id) === -1;})
                .sort(function (a, b) {return a.name[currentLang].localeCompare(b.name[currentLang], currentLang);});

            select.innerHTML = "";
            appendOption(select, "", t("fb.regionPh"));
            pinned.concat(others).forEach(function (region) {
                appendOption(select, region.id, region.name[currentLang]);
            });

            select.value = findRegion(previous) ? previous : "";
        }

        function renderDistricts(keepSelection) {
            const regionSelect = document.getElementById("region");
            const select = document.getElementById("district");
            const region = findRegion(regionSelect.value);
            const previous = keepSelection ? select.value : "";

            select.innerHTML = "";

            if (!region) {
                appendOption(select, "", t("fb.districtPhDisabled"));
                select.disabled = true;
                select.value = "";
                return;
            }

            appendOption(select, "", t("fb.districtPh"));
            region.districts
                .slice()
                .sort(function (a, b) {
                    return a.sort[currentLang].localeCompare(b.sort[currentLang], currentLang) ||
                        a.id.localeCompare(b.id);
                })
                .forEach(function (district) {
                    appendOption(select, district.id, district.name[currentLang]);
                });

            select.disabled = false;

            const stillValid = region.districts.some(function (d) {return d.id === previous;});
            select.value = stillValid ? previous : "";
        }

        /* =====================================================
           FORM HELPERS
           ===================================================== */
        function renderRatingTitles() {
            document.querySelectorAll(".rating button").forEach(function (button) {
                const n = button.getAttribute("data-rating");
                button.setAttribute("title", t("fb.ratingTitle", {n: n}));
                button.setAttribute("aria-label", t("fb.ratingTitle", {n: n}));
            });
        }

        function showError(key) {
            currentErrorKey = key;
            renderError();
        }

        function renderError() {
            const box = document.getElementById("formError");
            if (currentErrorKey) {
                box.textContent = t(currentErrorKey);
                box.hidden = false;
            } else {
                box.textContent = "";
                box.hidden = true;
            }
        }

        /* =====================================================
           EXISTING NAVIGATION AND FORM LOGIC
           ===================================================== */
        function showFeedback() {
            document.getElementById("home").style.display = "none";
            document.getElementById("feedbackPage").style.display = "block";
            window.scrollTo(0, 0);
        }


        function showHome() {
            document.getElementById("feedbackPage").style.display = "none";
            document.getElementById("confirmationPage").style.display = "none";
            document.getElementById("howItWorksPage").style.display = "none";
            document.getElementById("home").style.display = "flex";
            window.scrollTo(0, 0);
        }

        function showConfirmation() {
            document.getElementById("home").style.display = "none";
            document.getElementById("feedbackPage").style.display = "none";
            document.getElementById("confirmationPage").style.display = "flex";
            window.scrollTo(0, 0);
        }

        function setRating(rating) {
            selectedRating = rating;

            const buttons = document.querySelectorAll(".rating button");

            buttons.forEach(function (button, index) {
                button.classList.toggle("active", index < rating);
            });
        }

        function submitFeedback() {
            const hospital = document.getElementById("hospital").value;
            const region = document.getElementById("region").value;
            const district = document.getElementById("district").value;
            const feedback = document.getElementById("feedbackText").value.trim();
            const category = document.getElementById("category").value;

            const regionData = findRegion(region);
            const districtValid = !!regionData && regionData.districts.some(function (d) {return d.id === district;});

            if (!hospital || !regionData || !districtValid || !feedback || !category || selectedRating === 0) {
                showError("fb.errorIncomplete");
                return;
            }

            showError(null);

            document.getElementById("hospital").value = "";
            document.getElementById("region").value = "";
            renderDistricts(false);
            document.getElementById("feedbackText").value = "";
            document.getElementById("category").value = "";

            setRating(0);
            showConfirmation();
        }
        function learnMore() {
            document.getElementById("home").style.display = "none";
            document.getElementById("feedbackPage").style.display = "none";
            document.getElementById("confirmationPage").style.display = "none";
            document.getElementById("howItWorksPage").style.display = "flex";
            window.scrollTo(0, 0);
        }

        /* =====================================================
           INIT
           ===================================================== */
        document.querySelectorAll(".lang-btn").forEach(function (btn) {
            btn.addEventListener("click", function () {
                setLanguage(btn.getAttribute("data-lang"));
            });
        });

        // Changing region always clears the district
        document.getElementById("region").addEventListener("change", function () {
            renderDistricts(false);
        });

        // Hide the validation message as soon as the user edits the form
        document.getElementById("feedbackCard").addEventListener("input", function () {
            if (currentErrorKey) showError(null);
        });
        document.getElementById("feedbackCard").addEventListener("change", function () {
            if (currentErrorKey) showError(null);
        });

        setLanguage(readStoredLang());
    </script>

</body>

</html>
